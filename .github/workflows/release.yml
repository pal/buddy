name: Release

# Push a tag like v0.1.0 to build and publish Buddy.dmg and Buddy.zip.
# With the Developer ID secrets (see README) the app is signed and notarized, and the
# release fails if Gatekeeper would not open it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/import-certificate.sh

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${{ github.run_number }}" scripts/build-app.sh

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh build/Buddy.app

      - name: Distribution check
        env:
          REQUIRE_NOTARIZED: ${{ env.HAS_SIGNING == 'true' && '1' || '0' }}
        run: scripts/check-distribution.sh build/Buddy.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/Buddy.app build/Buddy.zip
          mkdir -p build/dmg
          cp -R build/Buddy.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Buddy -srcfolder build/dmg -ov -format UDZO build/Buddy.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Ladda ner Buddy.dmg, dra Buddy till Program och starta. Se README för första start."
          if [ "$HAS_SIGNING" != "true" ]; then
            NOTES="$NOTES Den här versionen är inte notariserad av Apple: första gången öppnar du den via Systeminställningar → Integritet och säkerhet → Öppna ändå."
          fi
          gh release create "$GITHUB_REF_NAME" build/Buddy.dmg build/Buddy.zip \
            --title "Buddy $GITHUB_REF_NAME" --notes "$NOTES"
