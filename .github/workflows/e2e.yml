name: E2E

# Runs the real Buddy.app on a macOS runner and checks the use cases end to end:
# once with sentences fed in as recognized text, and once with Swedish speech played
# into a virtual microphone and recognized by Apple's speech recognition.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Build app
        run: scripts/build-app.sh

      - name: Prepare runner (virtual microphone, permissions)
        run: e2e/setup-ci.sh build/Buddy.app

      - name: E2E – injected speech
        timeout-minutes: 15
        run: python3 e2e/run_e2e.py --mode inject --out build/e2e/inject

      - name: E2E – real speech through the microphone
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python3 e2e/run_e2e.py --mode audio --out build/e2e/audio

      - name: E2E – real Claude API
        if: ${{ !cancelled() && env.ANTHROPIC_API_KEY != '' }}
        timeout-minutes: 10
        run: python3 e2e/run_e2e.py --mode live --out build/e2e/live

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: |
            build/e2e
          retention-days: 14
