name: CI

# One macOS job: build, unit tests, signing and notarization (when the Developer ID
# secrets exist), distribution check, then end-to-end tests of the same app bundle.
# On main, a run where everything passes publishes the tested Buddy.zip as a new
# release (the next patch version after the latest vX.Y.Z tag).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on main wait for each other, so every release gets its own version number.
# Newer pushes to a pull request cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      # Signing and notarization run when the Developer ID secrets exist (see README).
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_ID != '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The version this build gets: the tag already on this commit, or the next patch
      # version after the latest vX.Y.Z tag (0.1.0 if there is none).
      - name: Version
        run: |
          existing=$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$existing" ]; then
            version="${existing#v}"
            echo "ALREADY_RELEASED=true" >> "$GITHUB_ENV"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$latest" ]; then
              version=0.1.0
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Fails fast if Apple rejects the notarization credentials, also before a certificate exists.
      - name: Check notarization credentials
        if: env.HAS_NOTARIZATION == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh --check

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/import-certificate.sh

      - name: Build app bundle
        run: BUILD_NUMBER="${{ github.run_number }}" scripts/build-app.sh

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh build/Buddy.app

      - name: Distribution check
        env:
          REQUIRE_NOTARIZED: ${{ env.HAS_SIGNING == 'true' && '1' || '0' }}
        run: scripts/check-distribution.sh build/Buddy.app

      - name: Package
        run: ditto -c -k --keepParent build/Buddy.app build/Buddy.zip

      # What installed copies get when they look for updates: the feed without credentials,
      # the published Buddy.zip, its signature and Gatekeeper's verdict.
      - name: Latest release, as installed copies see it
        run: |
          team=$(codesign -dv build/Buddy.app 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [ "$team" = "not set" ] && team=""
          scripts/check-release.sh "" "$team"

      - uses: actions/upload-artifact@v4
        with:
          name: Buddy
          path: build/Buddy.zip
          retention-days: 14

      # Copies of the same app for the e2e tests of auto-update: a newer one, signed and
      # notarized (99.0.0, served by a mock feed), and an older one (0.0.1) that updates
      # itself from the real release on GitHub.
      - name: Build update test apps (99.0.0 and 0.0.1)
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION=99.0.0 BUILD_NUMBER=9999 APP_PATH=build/update/Buddy.app scripts/build-app.sh
          scripts/notarize.sh build/update/Buddy.app
          ditto -c -k --keepParent build/update/Buddy.app build/update/Buddy.zip
          VERSION=0.0.1 BUILD_NUMBER=1 APP_PATH=build/old/Buddy.app scripts/build-app.sh

      # End-to-end tests of the app bundle built above.
      - name: Prepare runner for e2e (virtual microphone, permissions)
        run: e2e/setup-ci.sh build/Buddy.app

      - name: E2E – injected speech
        timeout-minutes: 15
        run: python3 e2e/run_e2e.py --mode inject --out build/e2e/inject

      - name: E2E – real speech through the microphone
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python3 e2e/run_e2e.py --mode audio --out build/e2e/audio

      - name: E2E – real Claude API
        if: ${{ !cancelled() && env.ANTHROPIC_API_KEY != '' }}
        timeout-minutes: 10
        run: python3 e2e/run_e2e.py --mode live --out build/e2e/live

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: build/e2e
          retention-days: 14

      # Only after every step above has passed, and only with a signed and notarized app.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING == 'true' && env.ALREADY_RELEASED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Buddy.zip \
            --target "$GITHUB_SHA" \
            --title "Buddy $VERSION" \
            --generate-notes \
            --notes "Ladda ner Buddy.zip, packa upp den och öppna Buddy. Buddy erbjuder sig att flytta till Program och uppdaterar sig sedan själv. Appen är signerad med Developer ID (Subtree Communications AB) och notariserad av Apple."

      # The new release, the way installed copies will get it.
      - name: Check the published release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING == 'true' && env.ALREADY_RELEASED != 'true'
        run: |
          team=$(codesign -dv build/Buddy.app 2>&1 | sed -n 's/^TeamIdentifier=//p')
          scripts/check-release.sh "$VERSION" "$team"

      - name: Release that would be published
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          echo "On main this run would publish v$VERSION with build/Buddy.zip ($(du -h build/Buddy.zip | cut -f1))"
          ditto -x -k build/Buddy.zip "$RUNNER_TEMP/release-check"
          defaults read "$RUNNER_TEMP/release-check/Buddy.app/Contents/Info" CFBundleShortVersionString
